  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="3" />

  <!-- Monogram Glyph 'S' -->
  <path d="M 40 31 C 33 27 23 28 20 35 C 17 44 41 45 40 56 C 39 64 29 69 19 66" 
