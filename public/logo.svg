<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="saBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="saBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Primary Glyph Gradient -->
    <linearGradient id="saGlyph1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Glyph Gradient -->
    <linearGradient id="saGlyph2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="saDropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#saBg)" stroke="url(#saBorder)" stroke-width="2.5" />

  <!-- Subtle Cyber Corner Accents -->
  <circle cx="20" cy="20" r="1.5" fill="#818cf8" opacity="0.7" />
  <circle cx="80" cy="80" r="1.5" fill="#22d3ee" opacity="0.7" />

  <!-- Monogram Glyph 'S' -->
  <path d="M 40 31 C 33 27 23 28 20 35 C 17 44 41 45 40 56 C 39 64 29 69 19 66" 
        fill="none" 
        stroke="url(#saGlyph1)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#saDropGlow)" />

  <!-- Monogram Glyph 'A' -->
  <path d="M 47 68 L 64 27 L 81 68" 
        fill="none" 
        stroke="url(#saGlyph2)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#saDropGlow)" />

  <!-- 'A' Crossbar -->
  <path d="M 53 53 L 75 53" 
        fill="none" 
        stroke="url(#saGlyph1)" 
        stroke-width="6.5" 
        stroke-linecap="round" />

  <!-- Glowing Tech Dot at Apex of A -->
  <circle cx="64" cy="21" r="3" fill="#22d3ee" />
  <circle cx="64" cy="21" r="6" fill="#22d3ee" opacity="0.25" />
</svg>
